<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Race · HEX</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="race-body">
    <main class="race-stage" id="raceStage">
      <!-- Stage 1: Start prompt -->
      <section class="race-screen race-screen--start active" id="raceStartScreen">
        <div class="race-bg race-bg--start"></div>
        <div class="race-overlay"></div>
        <div class="race-start-content">
          <h1 class="race-start-title">Start your driver experience</h1>
          <p class="race-start-sub">Are you ready?</p>
          <button class="race-start-btn" id="raceStartBtn">Start</button>
        </div>
        <a class="race-back" href="circuit.html" aria-label="Back to Circuit">‹ Back</a>
      </section>

      <!-- 3-2-1-GO countdown -->
      <div class="countdown-overlay" id="countdownOverlay" aria-hidden="true">
        <div class="countdown-num" id="countdownNum">3</div>
      </div>

      <!-- Stage 2: Live race HUD -->
      <section class="race-screen race-screen--live" id="raceLiveScreen">
        <div class="race-bg race-bg--live"></div>
        <div class="race-overlay race-overlay--live"></div>

        <!-- Top-left: lap timer card -->
        <div class="hud-lap-timer">
          <div class="lap-time" id="lapTime">00:00.000</div>
          <div class="lap-label">Current Lap</div>
          <div class="best-lap">
            <span class="best-label">Best Lap</span>
            <span class="best-val" id="bestLap">—</span>
          </div>
        </div>

        <!-- Top-right: mini-map / live cam -->
        <div class="hud-minimap">
          <div class="minimap-img"></div>
        </div>

        <!-- Position indicator -->
        <div class="hud-position">
          <div class="pos-label">Position</div>
          <div class="pos-val"><span id="positionCurrent">6</span> / 12</div>
          <svg class="pos-arc" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
            <circle id="posArc" cx="30" cy="30" r="26" fill="none" stroke="#fff" stroke-width="3"
                    stroke-dasharray="163.36" stroke-dashoffset="81.7" stroke-linecap="round"
                    transform="rotate(-90 30 30)"/>
          </svg>
        </div>

        <!-- Right-bottom: speedo + gear -->
        <div class="hud-speedo">
          <svg class="speedo-arc" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="62" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6"/>
            <circle id="speedoArc" cx="70" cy="70" r="62" fill="none" stroke="#e63b2e" stroke-width="6"
                    stroke-dasharray="389.56" stroke-dashoffset="389.56" stroke-linecap="round"
                    transform="rotate(135 70 70)"/>
          </svg>
          <div class="speedo-inner">
            <div class="speedo-small" id="speedVal">07</div>
            <div class="gear-val" id="gearVal">2</div>
          </div>
        </div>

        <a class="race-back race-back--live" href="circuit.html" aria-label="Exit Race">Exit</a>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
