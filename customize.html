<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customize · HEX</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="assets/logo.png" alt="HEX" />
          <span class="brand-sub">HEX XR Cockpit System</span>
        </div>
        <div class="nav-right">
          <nav class="nav-links">
            <a href="index.html">Connect</a>
            <a href="customize.html" class="active">Customize</a>
            <a href="circuit.html">Circuit</a>
            <a href="race.html">Race</a>
          </nav>
          <button class="menu-btn" aria-label="Menu">
            <span></span><span></span>
          </button>
        </div>
      </header>

      <main class="page customize-page">
        <div class="customize-grid">
          <!-- LEFT: Paint + Driving style -->
          <aside class="panel-card panel-left">
            <section class="panel-section">
              <h3 class="panel-title">Paint</h3>
              <div class="swatch-grid" id="paintGrid">
                <button class="swatch-cell" data-car="white" data-color="#ffffff" aria-label="White">
                  <span class="swatch-dot swatch-dot--white"></span>
                  <span class="swatch-label">White</span>
                </button>
                <button class="swatch-cell active" data-car="black" data-color="#1a1a1a" aria-label="Black">
                  <span class="swatch-dot" style="background:#1a1a1a;"></span>
                  <span class="swatch-label">Black</span>
                </button>
                <button class="swatch-cell" data-car="gray" data-color="#9a9a9a" aria-label="Gray">
                  <span class="swatch-dot" style="background:#9a9a9a;"></span>
                  <span class="swatch-label">Gray</span>
                </button>
                <button class="swatch-cell" data-car="red" data-color="#e63b2e" aria-label="Red">
                  <span class="swatch-dot" style="background:#e63b2e;"></span>
                  <span class="swatch-label">Red</span>
                </button>
                <button class="swatch-cell" data-car="yellow" data-color="#ffd02f" aria-label="Yellow">
                  <span class="swatch-dot" style="background:#ffd02f;"></span>
                  <span class="swatch-label">Yellow</span>
                </button>
                <button class="swatch-cell" data-car="green" data-color="#3cba54" aria-label="Green">
                  <span class="swatch-dot" style="background:#3cba54;"></span>
                  <span class="swatch-label">Green</span>
                </button>
                <button class="swatch-cell" data-car="blue" data-color="#3b82f6" aria-label="Blue">
                  <span class="swatch-dot" style="background:#3b82f6;"></span>
                  <span class="swatch-label">Blue</span>
                </button>
                <button class="swatch-cell" data-car="purple" data-color="#8a5cf6" aria-label="Purple">
                  <span class="swatch-dot" style="background:#8a5cf6;"></span>
                  <span class="swatch-label">Purple</span>
                </button>
                <button class="swatch-cell" data-car="pink" data-color="#ff9ec7" aria-label="Pink">
                  <span class="swatch-dot" style="background:#ff9ec7;"></span>
                  <span class="swatch-label">Pink</span>
                </button>
              </div>
            </section>

            <section class="panel-section">
              <h3 class="panel-title">Driving style</h3>
              <div class="style-stack" id="styleStack">
                <button class="style-pill" data-style="easy">Easy</button>
                <button class="style-pill active" data-style="normal">Normal</button>
                <button class="style-pill" data-style="hard">Hard</button>
              </div>
            </section>
          </aside>

          <!-- CENTER: car stage + Done -->
          <section class="car-center">
            <div class="car-stage" id="carStage">
              <img class="car-image" id="carImage" src="assets/car_black.png" alt="F1 car preview" />
              <div class="car-wheels-layer" aria-hidden="true">
                <div class="wheel-slot wheel-slot--front">
                  <img class="wheel-slot-img" id="frontWheelImg" alt="" />
                </div>
                <div class="wheel-slot wheel-slot--rear">
                  <img class="wheel-slot-img" id="rearWheelImg" alt="" />
                </div>
              </div>
              <div class="car-shadow" aria-hidden="true"></div>
              <div class="rotate-badge" aria-hidden="true">360°</div>
            </div>
            <a href="circuit.html" class="cta done-btn" id="doneBtn">Done</a>
          </section>

          <!-- RIGHT: Wheel -->
          <aside class="panel-card panel-right">
            <h3 class="panel-title">Wheel</h3>
            <div class="wheel-stack" id="wheelStack">
              <button class="wheel-card" data-wheel="0" aria-label="Wheel red sidewall">
                <span class="wheel-img" data-wheel-img="0"></span>
              </button>
              <button class="wheel-card" data-wheel="1" aria-label="Wheel yellow sidewall">
                <span class="wheel-img" data-wheel-img="1"></span>
              </button>
              <button class="wheel-card" data-wheel="2" aria-label="Wheel white sidewall">
                <span class="wheel-img" data-wheel-img="2"></span>
              </button>
              <button class="wheel-card" data-wheel="3" aria-label="Wheel green sidewall">
                <span class="wheel-img" data-wheel-img="3"></span>
              </button>
            </div>
          </aside>
        </div>

        <div class="foot">
          <span class="live">Hand tracking ready · MediaPipe</span>
          <span>HEX/02 — Vehicle</span>
        </div>
      </main>
    </div>

    <!-- Hand tracking overlay (cursor + dwell ring) -->
    <div class="hand-overlay" id="handOverlay" aria-hidden="true">
      <div class="hand-cursor" id="handCursor">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <circle class="dwell-ring" cx="24" cy="24" r="20" fill="none" stroke="rgba(230,59,46,0.25)" stroke-width="3"/>
          <circle class="dwell-progress" id="dwellProgress" cx="24" cy="24" r="20" fill="none" stroke="#e63b2e" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="125.6" transform="rotate(-90 24 24)"/>
          <circle cx="24" cy="24" r="5" fill="#e63b2e"/>
        </svg>
      </div>
    </div>

    <!-- Hidden webcam input for MediaPipe -->
    <video id="webcam" class="webcam-hidden" autoplay playsinline muted></video>

    <script src="js/main.js"></script>
    <script type="module" src="js/hand-tracking.js"></script>
  </body>
</html>
